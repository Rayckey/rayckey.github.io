name: Deploy personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
      - name: Refresh pages and asset versions
        run: python3 scripts/build_pages.py
      - name: Collect website files
        run: |
          site_source=.
          if [ -f public/index.html ]; then site_source=public; fi
          mkdir -p "$RUNNER_TEMP/personal-site"
          for entry in .nojekyll assets projects index.html styles.css site.js robots.txt sitemap.xml; do
            cp -R "$site_source/$entry" "$RUNNER_TEMP/personal-site/"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/personal-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
